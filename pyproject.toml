[project]
name = "image-restoration-promptir"
version = "0.1.0"
description = "PromptIR for Image Restoration (Rain/Snow)"
requires-python = ">=3.13"
dependencies = [
    "torch==2.12.0+cu130",
    "torchvision==0.27.0+cu130",
    "torchmetrics==1.9.0",
    "accelerate==1.13.0",
    "einops==0.8.2",
    "pillow>=12.2.0",
    "wandb>=0.27.0",
    "tqdm>=4.67.3",
]

[tool.uv.sources]
torch = { index = "pytorch-cu130" }
torchvision = { index = "pytorch-cu130" }

[[tool.uv.index]]
name = "pytorch-cu130"
url = "https://download.pytorch.org/whl/cu130"
explicit = true

[project.optional-dependencies]
dev = ["ruff"]


